version: '3.8'

services:
  act-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: act:dev
    container_name: act-dev
    volumes:
      # 挂载项目根目录
      - .:/workspace
      # 挂载数据目录（如果在本机有数据）
      - ./data:/workspace/data
      - ./checkpoints:/workspace/checkpoints
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # GPU 支持（需要 nvidia-docker）
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
    # 如果使用 GPU，取消注释下面的行
    # runtime: nvidia
    networks:
      - act-network

  act-eval:
    build:
      context: .
      dockerfile: Dockerfile
    image: act:dev
    container_name: act-eval
    volumes:
      - .:/workspace
      - ./checkpoints:/workspace/checkpoints
      - ./data:/workspace/data
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    working_dir: /workspace
    stdin_open: true
    tty: true
    # runtime: nvidia
    networks:
      - act-network

networks:
  act-network:
    driver: bridge
